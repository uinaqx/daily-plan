<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070A12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <title>每日计划 · 高级版</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📋%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg0: #070A12;
      --bg1: #0B1022;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --muted2: rgba(255,255,255,.45);
      --accent: #7C5CFF;
      --accent2: #2DD4BF;
      --warn: #F59E0B;
      --danger: #EF4444;
      --ok: #22C55E;
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --shadow2: 0 10px 30px rgba(0,0,0,.35);
      --r: 18px;
      --r2: 26px;
      --blur: 16px;
      --hmSize: 34px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    [data-theme="light"] {
      --bg0: #F7F7FB;
      --bg1: #FFFFFF;
      --card: rgba(0,0,0,.04);
      --card2: rgba(0,0,0,.06);
      --stroke: rgba(0,0,0,.10);
      --text: rgba(0,0,0,.86);
      --muted: rgba(0,0,0,.60);
      --muted2: rgba(0,0,0,.45);
      --shadow: 0 18px 60px rgba(10,10,20,.10);
      --shadow2: 0 10px 30px rgba(10,10,20,.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; padding: 0; overflow-x: hidden; }
    
    body {
      font-family: var(--sans);
      color: var(--text);
      background: var(--bg0);
      background-image:
        radial-gradient(1000px 600px at 12% 12%, rgba(124,92,255,.35), transparent 55%),
        radial-gradient(900px 550px at 88% 18%, rgba(45,212,191,.26), transparent 55%),
        radial-gradient(900px 650px at 50% 95%, rgba(245,158,11,.16), transparent 58%);
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    .aurora {
      position: fixed;
      inset: -80px;
      background:
        radial-gradient(600px 420px at 25% 40%, rgba(124,92,255,.25), transparent 60%),
        radial-gradient(620px 420px at 70% 30%, rgba(45,212,191,.20), transparent 60%),
        radial-gradient(520px 420px at 60% 75%, rgba(236,72,153,.14), transparent 60%);
      filter: blur(30px);
      opacity: .85;
      pointer-events: none;
      mix-blend-mode: screen;
      animation: floaty 12s ease-in-out infinite alternate;
      z-index: 0;
    }
    
    @keyframes floaty {
      0% { transform: translate3d(-10px,-8px,0) scale(1.02); }
      100% { transform: translate3d(10px,8px,0) scale(1.06); }
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 12px calc(80px + var(--safe-bottom)) 12px;
      position: relative;
      z-index: 1;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin: 10px 0 18px;
      flex-wrap: wrap;
    }

    .title { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 280px; }
    
    .title h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: .2px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--stroke);
      color: var(--muted);
      font-size: 12px;
      width: fit-content;
      backdrop-filter: blur(var(--blur));
      box-shadow: 0 1px 0 rgba(255,255,255,.04) inset;
    }

    .pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 0 3px rgba(124,92,255,.18);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--stroke);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 650;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(var(--blur));
      box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, var(--shadow2);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .btn:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.18); background: var(--card2); }
    .btn:active { transform: translateY(0px) scale(.97); opacity: .92; }
    .btn.primary {
      border: 1px solid rgba(124,92,255,.45);
      background: linear-gradient(135deg, rgba(124,92,255,.22), rgba(45,212,191,.14));
    }
    .btn.ghost { background: transparent; box-shadow: none; }
    .btn.danger {
      border-color: rgba(239,68,68,.35);
      background: linear-gradient(135deg, rgba(239,68,68,.16), rgba(0,0,0,0));
    }
    .btn.small { padding: 7px 10px; border-radius: 9px; font-weight: 650; font-size: 12px; }
    .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .btn.icon-btn { padding: 10px; min-width: 44px; justify-content: center; }

    .grid {
      display: grid;
      grid-template-columns: 1.12fr .88fr;
      gap: 14px;
      margin-top: 14px;
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: stretch; }
      .actions { justify-content: center; }
      .title { min-width: 100%; }
      .title h1 { font-size: 20px; }
    }

    .card {
      border-radius: var(--r2);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(var(--blur));
      overflow: hidden;
      position: relative;
    }

    [data-theme="light"] .card { background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.02)); }
    
    .card .hd {
      padding: 16px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card .hd h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: .2px;
      color: var(--muted);
      font-weight: 700;
    }

    .card .bd { padding: 0 16px 16px; }
    .divider { height: 1px; background: var(--stroke); margin: 0 16px; }

    .dateNav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .dateBox {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--stroke);
      box-shadow: 0 1px 0 rgba(255,255,255,.06) inset;
      backdrop-filter: blur(var(--blur));
      flex: 1;
      min-width: 200px;
    }

    .dateBox .date { font-weight: 800; font-size: 18px; letter-spacing: .2px; }
    .dateBox .weekday { font-size: 12px; color: var(--muted); font-weight: 650; }

    .formRow {
      display: grid;
      grid-template-columns: 1fr 140px 100px;
      gap: 10px;
      margin-top: 10px;
    }

    @media (max-width: 520px) {
      .formRow { grid-template-columns: 1fr 1fr; }
      .formRow .btn { grid-column: span 2; }
      .dateBox { min-width: 100%; }
    }

    .in {
      width: 100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: rgba(0,0,0,.12);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color .15s ease, transform .15s ease;
      -webkit-appearance: none;
    }

    [data-theme="light"] .in { background: rgba(255,255,255,.80); }
    
    .in:focus {
      border-color: rgba(124,92,255,.55);
      box-shadow: 0 0 0 4px rgba(124,92,255,.16);
      transform: translateY(-1px);
    }

    .in::placeholder { color: var(--muted2); }

    .help {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted2);
      line-height: 1.55;
    }

    .kbd {
      font-family: var(--mono);
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      color: var(--muted);
      font-size: 11px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    @media (max-width: 640px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
    }

    .stat {
      border-radius: 16px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.05);
      padding: 12px;
      box-shadow: 0 1px 0 rgba(255,255,255,.05) inset;
      min-width: 0;
    }

    [data-theme="light"] .stat { background: rgba(0,0,0,.03); }
    .stat .k { font-size: 11px; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat .v { font-size: 18px; font-weight: 850; margin-top: 6px; }
    .stat .s { font-size: 11px; color: var(--muted2); margin-top: 4px; }

    .vizGrid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .vizCard {
      border-radius: 18px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.05);
      padding: 12px;
      overflow: hidden;
      position: relative;
    }

    [data-theme="light"] .vizCard { background: rgba(0,0,0,.03); }
    
    .vizTitle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .vizTitle .l {
      font-size: 12px;
      color: var(--muted);
      font-weight: 750;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      color: var(--muted);
      background: rgba(255,255,255,.06);
      white-space: nowrap;
    }

    .ringWrap {
      display: flex;
      gap: 14px;
      align-items: center;
      min-height: 120px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .ring {
      width: 110px;
      height: 110px;
      flex: 0 0 auto;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,.35));
    }

    .ring text { font-weight: 850; fill: var(--text); }
    .ring .sub { fill: var(--muted); font-weight: 750; }
    .ring .track { stroke: rgba(255,255,255,.14); }
    [data-theme="light"] .ring .track { stroke: rgba(0,0,0,.12); }
    .ring .prog {
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      stroke: url(#grad);
      transition: stroke-dashoffset .6s cubic-bezier(.2,.9,.2,1);
    }

    .bars {
      width: 100%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 650;
    }

    .bar > div:first-child { min-width: 80px; }
    .bar > div:last-child { min-width: 50px; text-align: right; }

    .bar .meter {
      flex: 1;
      height: 10px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.05);
      overflow: hidden;
      position: relative;
    }

    [data-theme="light"] .bar .meter { background: rgba(0,0,0,.03); }
    
    .bar .fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(124,92,255,.90), rgba(45,212,191,.85));
      box-shadow: 0 0 0 1px rgba(255,255,255,.10) inset;
      transition: width .55s cubic-bezier(.2,.9,.2,1);
    }

    .tasks {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .task {
      border-radius: 18px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.05);
      padding: 12px;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: center;
      position: relative;
      overflow: hidden;
      transition: transform .15s ease, background .15s ease;
      touch-action: manipulation;
    }

    [data-theme="light"] .task { background: rgba(0,0,0,.03); }
    .task:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.18); }
    .task:active { transform: scale(.99); }

    .task::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(480px 240px at 10% 0%, rgba(124,92,255,.16), transparent 60%);
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }

    .task:hover::before { opacity: 1; }

    .chk {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 8px;
      border: 2px solid var(--stroke);
      background: rgba(255,255,255,.05);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select: none;
    }

    .chk:active { transform: scale(.9); }
    .chk svg { opacity: 0; transform: scale(.6); transition: opacity .12s ease, transform .12s ease; width: 14px; height: 14px; }

    .task.done .chk {
      border-color: rgba(34,197,94,.40);
      background: rgba(34,197,94,.12);
    }
    .task.done .chk svg { opacity: 1; transform: scale(1); color: var(--ok); }
    .task.done .chk svg path { fill: var(--ok); }

    .tMain {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .tText {
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tMeta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      color: var(--muted);
      background: rgba(255,255,255,.06);
      display: inline-flex;
      gap: 6px;
      align-items: center;
      white-space: nowrap;
    }

    .tag .miniDot { width: 6px; height: 6px; border-radius: 999px; background: rgba(124,92,255,.85); }
    .task.done .tText { text-decoration: line-through; opacity: .7; }
    .task.done .tag .miniDot { background: rgba(34,197,94,.9); }

    .tBtns {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    @media (max-width: 480px) {
      .task { grid-template-columns: 44px 1fr; gap: 8px; }
      .tBtns { grid-column: span 2; justify-content: flex-end; margin-top: 4px; }
    }

    .empty {
      border-radius: 22px;
      border: 1px dashed rgba(255,255,255,.20);
      padding: 20px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,.03);
      margin-top: 10px;
    }

    [data-theme="light"] .empty { border-color: rgba(0,0,0,.18); background: rgba(0,0,0,.02); }
    .empty strong { color: var(--text); }

    .modalMask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
      backdrop-filter: blur(4px);
    }

    .modal {
      width: min(860px, 96vw);
      max-height: 90vh;
      border-radius: 24px;
      border: 1px solid var(--stroke);
      background: rgba(10,10,20,.92);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    [data-theme="light"] .modal { background: rgba(255,255,255,.95); }
    
    .modal .mhd {
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--stroke);
      flex-shrink: 0;
    }

    .modal .mhd h3 { margin: 0; font-size: 14px; color: var(--text); font-weight: 850; }
    .modal .mbd { padding: 14px; overflow-y: auto; flex: 1; }

    .ta {
      width: 100%;
      min-height: 120px;
      border-radius: 16px;
      border: 1px solid var(--stroke);
      background: rgba(0,0,0,.15);
      color: var(--text);
      padding: 12px;
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
      resize: vertical;
    }

    [data-theme="light"] .ta { background: rgba(0,0,0,.05); }
    
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 10px;
    }

    .hint { font-size: 12px; color: var(--muted2); line-height: 1.6; }

    .monthBar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; justify-content: center; }
    
    .heatmapWrap { display: flex; flex-direction: column; gap: 8px; }
    
    .heatmapWeekdays {
      display: grid;
      grid-template-columns: repeat(7, var(--hmSize));
      gap: 6px;
      font-size: 11px;
      color: var(--muted2);
      padding: 0 2px;
      user-select: none;
      justify-content: center;
    }

    .heatmapGrid {
      display: grid;
      grid-template-columns: repeat(7, var(--hmSize));
      grid-auto-rows: var(--hmSize);
      gap: 6px;
      padding: 2px;
      justify-content: center;
    }

    @media (max-width: 520px) {
      :root { --hmSize: 28px; }
      .heatmapGrid { gap: 4px; }
      .heatmapWeekdays { gap: 4px; }
    }

    .hmCell {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.04);
      cursor: pointer;
      position: relative;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
      box-shadow: 0 1px 0 rgba(255,255,255,.05) inset;
      overflow: hidden;
      touch-action: manipulation;
    }

    [data-theme="light"] .hmCell { background: rgba(0,0,0,.03); }
    .hmCell:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.18); }
    .hmCell:active { transform: scale(.95); }
    .hmCell.empty { cursor: default; opacity: .35; }
    .hmCell.empty:hover { transform: none; }

    .hmCell .d {
      position: absolute;
      left: 7px;
      bottom: 6px;
      font-size: 13px;
      font-weight: 850;
      color: rgba(255,255,255,.85);
      text-shadow: 0 2px 10px rgba(0,0,0,.35);
    }

    [data-theme="light"] .hmCell .d { color: rgba(0,0,0,.70); text-shadow: none; }

    .toast {
      position: fixed;
      left: 50%;
      top: 14px;
      top: calc(14px + var(--safe-top));
      transform: translateX(-50%);
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      max-width: 90vw;
    }

    .toast .item {
      pointer-events: none;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(16px);
      color: var(--text);
      padding: 10px 14px;
      box-shadow: var(--shadow2);
      font-size: 13px;
      animation: pop .25s ease-out;
      max-width: 320px;
      text-align: center;
    }

    [data-theme="light"] .toast .item { background: rgba(255,255,255,.90); }

    @keyframes pop {
      from { transform: translateY(8px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    #fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
    }

    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10,10,20,.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--stroke);
      padding: 8px 16px;
      padding-bottom: calc(8px + var(--safe-bottom));
      z-index: 40;
      justify-content: space-around;
    }

    [data-theme="light"] .mobile-nav { background: rgba(255,255,255,.95); }

    @media (max-width: 768px) {
      .mobile-nav { display: flex; }
      .wrap { padding-bottom: calc(70px + var(--safe-bottom)); }
      .actions .btn:not(.icon-btn) span { display: none; }
      .actions .btn { padding: 10px; min-width: 44px; justify-content: center; }
    }

    .mobile-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      border-radius: 12px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      transition: all .15s ease;
      min-width: 60px;
    }

    .mobile-nav .nav-item.active {
      color: var(--accent);
      background: rgba(124,92,255,.12);
    }

    .mobile-nav .nav-item:active { transform: scale(.95); }
    .mobile-nav .nav-icon { font-size: 20px; }
  </style>
</head>
<body>
  <div class="aurora"></div>
  <canvas id="fx"></canvas>

  <div class="wrap" id="app">
    <header>
      <div class="title">
        <h1>每日计划 <span class="pill"><span class="dot"></span><span id="subTitle">离线可用 · 自动保存</span></span></h1>
        <div class="dateNav">
          <button class="btn small" id="prevDay">◀︎</button>
          <div class="dateBox" title="当前日期">
            <div class="date" id="dateText">0000-00-00</div>
            <div class="weekday" id="weekText">周一</div>
          </div>
          <button class="btn small" id="nextDay">▶︎</button>
          <button class="btn small ghost" id="todayBtn">今天</button>
        </div>
      </div>

      <div class="actions">
        <button class="btn icon-btn" id="themeBtn" title="切换深浅色">🌓</button>
        <button class="btn icon-btn" id="openMonth" title="本月完成情况">📅</button>
        <button class="btn icon-btn danger" id="clearDay" title="清空当天">🗑️</button>
      </div>
    </header>

    <div class="grid">
      <section class="card">
        <div class="hd">
          <h2>今天要做什么</h2>
          <div class="badge" id="saveBadge">已保存</div>
        </div>
        <div class="divider"></div>
        <div class="bd">
          <div class="formRow">
            <input class="in" id="taskText" placeholder="任务内容..." />
            <input class="in" id="taskMin" type="number" min="1" step="1" placeholder="分钟" />
            <button class="btn primary" id="addTask">添加</button>
          </div>
          <div class="help">按 <span class="kbd">Enter</span> 也能添加任务</div>

          <div class="stats" id="stats">
            <div class="stat"><div class="k">总任务</div><div class="v" id="stTotal">0</div></div>
            <div class="stat"><div class="k">已完成</div><div class="v" id="stDone">0</div></div>
            <div class="stat"><div class="k">预计</div><div class="v" id="stAllMin">0</div><div class="s">分钟</div></div>
            <div class="stat"><div class="k">完成</div><div class="v" id="stDoneMin">0</div><div class="s">分钟</div></div>
          </div>

          <div class="tasks" id="taskList"></div>
          <div class="empty" id="emptyBox" style="display:none;">
            <div><strong>今天还没有任务</strong>，先加一条试试</div>
          </div>
        </div>
      </section>

      <aside class="card">
        <div class="hd">
          <h2>进度面板</h2>
          <div class="badge" id="rateBadge">0%</div>
        </div>
        <div class="divider"></div>
        <div class="bd">
          <div class="vizGrid">
            <div class="vizCard">
              <div class="vizTitle">
                <div class="l">完成率</div>
                <div class="badge" id="ringLabel">0 / 0</div>
              </div>
              <div class="ringWrap">
                <svg class="ring" viewBox="0 0 120 120" aria-label="progress ring">
                  <defs>
                    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="rgba(124,92,255,.95)" />
                      <stop offset="100%" stop-color="rgba(45,212,191,.90)" />
                    </linearGradient>
                  </defs>
                  <circle class="track" cx="60" cy="60" r="46" fill="none" stroke-width="12"></circle>
                  <circle class="prog" cx="60" cy="60" r="46" fill="none" stroke-width="12" stroke-dasharray="289.0" stroke-dashoffset="289.0"></circle>
                  <text x="60" y="57" text-anchor="middle" font-size="18" id="ringPct">0%</text>
                  <text x="60" y="77" text-anchor="middle" font-size="11" class="sub" id="ringSub">今天</text>
                </svg>

                <div class="bars">
                  <div class="bar">
                    <div>完成任务</div>
                    <div class="meter"><div class="fill" id="barDone"></div></div>
                    <div id="barDoneTxt">0%</div>
                  </div>
                  <div class="bar">
                    <div>完成时长</div>
                    <div class="meter"><div class="fill" id="barMin"></div></div>
                    <div id="barMinTxt">0%</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="vizCard">
              <div class="vizTitle">
                <div class="l">近 7 天趋势</div>
                <div class="badge" id="trendBadge">—</div>
              </div>
              <svg id="trend" viewBox="0 0 600 160" width="100%" height="160" role="img" aria-label="7-day trend">
                <defs>
                  <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="rgba(124,92,255,.28)" />
                    <stop offset="100%" stop-color="rgba(124,92,255,0)" />
                  </linearGradient>
                </defs>
                <path id="trendArea" d="" fill="url(#trendFill)"></path>
                <path id="trendLine" d="" fill="none" stroke="rgba(45,212,191,.85)" stroke-width="3" stroke-linecap="round"></path>
                <g id="trendDots"></g>
                <g id="trendAxis"></g>
              </svg>
            </div>

            <div class="vizCard">
              <div class="vizTitle">
                <div class="l">快捷操作</div>
              </div>
              <div class="row">
                <button class="btn small" id="copyUnfinished">复制到明天</button>
                <button class="btn small" id="sortByMin">按时长排序</button>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div class="modalMask" id="monthMask">
    <div class="modal" role="dialog" aria-modal="true" aria-label="month summary modal">
      <div class="mhd">
        <h3 id="monthTitle">本月完成情况</h3>
        <button class="btn small" id="closeMonth">关闭</button>
      </div>
      <div class="mbd">
        <div class="hint" id="monthHint" style="margin-bottom:10px;">方格颜色越深，代表当天已完成时长越长。点击某一天可跳转。</div>
        <div class="monthBar">
          <button class="btn small" id="monthPrev">◀︎</button>
          <button class="btn small ghost" id="monthNow">本月</button>
          <button class="btn small" id="monthNext">▶︎</button>
        </div>
        <div class="heatmapWrap">
          <div class="heatmapWeekdays" aria-hidden="true">
            <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
          </div>
          <div class="heatmapGrid" id="monthGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <nav class="mobile-nav">
    <button class="nav-item active" data-view="home">
      <span class="nav-icon">📋</span>
      <span>任务</span>
    </button>
    <button class="nav-item" data-view="stats">
      <span class="nav-icon">📊</span>
      <span>统计</span>
    </button>
    <button class="nav-item" data-view="calendar">
      <span class="nav-icon">📅</span>
      <span>日历</span>
    </button>
    <button class="nav-item" data-view="settings">
      <span class="nav-icon">⚙️</span>
      <span>设置</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>

<script>
(() => {
  const STORAGE_PREFIX = "dailyPlan_";
  const THEME_KEY = "dailyPlan_theme";
  const SORT_KEY = "dailyPlan_sortMode";

  let currentDate = new Date();
  let tasks = [];
  let sortMode = localStorage.getItem(SORT_KEY) || "none";
  let doneToBottom = false;

  const $ = (id) => document.getElementById(id);
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const pad2 = (n) => String(n).padStart(2, "0");
  const formatDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const weekdayCN = (d) => ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  const keyOf = (dateStr) => `${STORAGE_PREFIX}${dateStr}`;
  const nowISO = () => new Date().toISOString();

  function toast(msg) {
    const box = $("toast");
    const el = document.createElement("div");
    el.className = "item";
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateY(6px)"; }, 2000);
    setTimeout(() => { el.remove(); }, 2350);
  }

  function pickCongrats(taskText) {
    const pool = [
      "✅ 干得漂亮！已完成",
      "🎉 Nice！又进一步",
      "🌟 继续保持！",
      "🚀 很好！进度加速",
      "🥳 打卡成功！"
    ];
    const base = pool[Math.floor(Math.random() * pool.length)];
    const t = String(taskText || "").trim();
    return t ? `${base}：${t}` : base;
  }

  function setSavedBadge(text) { $("saveBadge").textContent = text; }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem(THEME_KEY, theme);
    $("themeBtn").textContent = theme === "light" ? "🌙" : "🌓";
  }

  function initTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved) { applyTheme(saved); return; }
    const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
    applyTheme(prefersLight ? "light" : "dark");
  }

  function loadForDate(d) {
    const dateStr = formatDate(d);
    const raw = localStorage.getItem(keyOf(dateStr));
    tasks = raw ? safeParse(raw, []) : [];
    tasks = tasks.map(t => ({
      id: t.id || cryptoId(),
      text: String(t.text || "").trim(),
      minutes: Math.max(1, parseInt(t.minutes, 10) || 1),
      done: !!t.done,
      createdAt: t.createdAt || nowISO()
    })).filter(t => t.text);
    applySort();
    setSavedBadge("已加载");
  }

  function saveForDate() {
    const dateStr = formatDate(currentDate);
    localStorage.setItem(keyOf(dateStr), JSON.stringify(tasks));
    setSavedBadge("已保存");
  }

  function safeParse(s, fallback) {
    try { return JSON.parse(s); } catch { return fallback; }
  }

  function cryptoId() {
    return (crypto?.randomUUID?.() || ("id_" + Math.random().toString(16).slice(2) + Date.now().toString(16)));
  }

  function computeStats(list) {
    const total = list.length;
    const done = list.filter(t => t.done).length;
    const allMin = list.reduce((a, t) => a + t.minutes, 0);
    const doneMin = list.filter(t => t.done).reduce((a, t) => a + t.minutes, 0);
    const rate = total ? Math.round((done / total) * 100) : 0;
    const timeRate = allMin ? Math.round((doneMin / allMin) * 100) : 0;
    return { total, done, allMin, doneMin, rate, timeRate };
  }

  function formatHours(minutes) {
    const hours = minutes / 60;
    return hours % 1 === 0 ? String(hours) : hours.toFixed(1).replace(/\.0$/, "");
  }

  function renderHeader() {
    const d = currentDate;
    $("dateText").textContent = formatDate(d);
    $("weekText").textContent = weekdayCN(d);

    const stats = computeStats(tasks);
    $("rateBadge").textContent = `${stats.rate}%`;
    $("ringPct").textContent = `${stats.rate}%`;
    $("ringLabel").textContent = `${stats.done} / ${stats.total}`;

    const C = 2 * Math.PI * 46;
    const off = C * (1 - stats.rate / 100);
    const ring = document.querySelector(".ring .prog");
    ring.style.strokeDasharray = String(C.toFixed(1));
    ring.style.strokeDashoffset = String(off.toFixed(1));

    $("barDoneTxt").textContent = `${stats.rate}%`;
    $("barMinTxt").textContent = `${stats.timeRate}%`;
    $("barDone").style.width = `${stats.rate}%`;
    $("barMin").style.width = `${stats.timeRate}%`;

    $("stTotal").textContent = stats.total;
    $("stDone").textContent = stats.done;
    $("stAllMin").textContent = stats.allMin;
    $("stDoneMin").textContent = stats.doneMin;

    if (stats.total > 0 && stats.done === stats.total) {
      burstConfetti();
      $("trendBadge").textContent = "🎉 全部完成";
    } else {
      $("trendBadge").textContent = stats.total ? "进行中" : "—";
    }
  }

  function renderTasks() {
    const list = $("taskList");
    list.innerHTML = "";
    $("emptyBox").style.display = tasks.length ? "none" : "block";

    for (const t of tasks) {
      const row = document.createElement("div");
      row.className = "task" + (t.done ? " done" : "");
      row.dataset.id = t.id;

      const chk = document.createElement("div");
      chk.className = "chk";
      chk.title = "完成 / 取消完成";
      chk.innerHTML = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6.4 11.2 3.5 8.3l-1 1 3.9 3.9L14 5.6l-1-1-6.6 6.6Z" fill="currentColor"></path></svg>`;
      chk.onclick = () => {
        const wasDone = t.done;
        t.done = !t.done;
        if (!wasDone && t.done) toast(pickCongrats(t.text));
        saveForDate();
        renderAll(true);
      };

      const main = document.createElement("div");
      main.className = "tMain";
      const meta = t.done ? "已完成" : "未完成";
      main.innerHTML = `
        <div class="tText" title="${escapeHtml(t.text)}">${escapeHtml(t.text)}</div>
        <div class="tMeta">
          <span class="tag"><span class="miniDot"></span>${meta}</span>
          <span class="tag">⏱️ ${t.minutes} 分钟</span>
        </div>
      `;

      const btns = document.createElement("div");
      btns.className = "tBtns";
      const del = document.createElement("button");
      del.className = "btn small danger";
      del.textContent = "删除";
      del.onclick = () => {
        if (confirm("确定删除这条任务吗？")) {
          tasks = tasks.filter(x => x.id !== t.id);
          saveForDate();
          renderAll(true);
          toast("已删除");
        }
      };
      btns.appendChild(del);

      row.appendChild(chk);
      row.appendChild(main);
      row.appendChild(btns);
      list.appendChild(row);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  function renderTrend() {
    const days = [];
    const base = new Date(currentDate);
    base.setHours(12, 0, 0, 0);
    for (let i = 6; i >= 0; i--) {
      const d = new Date(base);
      d.setDate(base.getDate() - i);
      const dateStr = formatDate(d);
      const raw = localStorage.getItem(keyOf(dateStr));
      const arr = raw ? safeParse(raw, []) : [];
      const st = computeStats(arr);
      days.push({ dateStr, rate: st.rate, total: st.total });
    }

    const W = 600, H = 160;
    const padX = 26, padY = 18;
    const innerW = W - padX * 2;
    const innerH = H - padY * 2;

    const pts = days.map((d, idx) => {
      const x = padX + (innerW * (idx / (days.length - 1)));
      const y = padY + (innerH * (1 - d.rate / 100));
      return { x, y, ...d };
    });

    const dLine = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
    const dArea = `${dLine} L ${pts[pts.length - 1].x.toFixed(1)} ${(padY + innerH).toFixed(1)} L ${pts[0].x.toFixed(1)} ${(padY + innerH).toFixed(1)} Z`;

    $("trendLine").setAttribute("d", dLine);
    $("trendArea").setAttribute("d", dArea);

    const dots = $("trendDots");
    dots.innerHTML = "";
    const axis = $("trendAxis");
    axis.innerHTML = "";

    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", p.x);
      c.setAttribute("cy", p.y);
      c.setAttribute("r", 5);
      c.setAttribute("fill", "rgba(124,92,255,.95)");
      c.setAttribute("stroke", "rgba(255,255,255,.18)");
      c.setAttribute("stroke-width", "2");
      c.style.cursor = "default";
      c.onmouseenter = () => { $("trendBadge").textContent = `${p.dateStr} · ${p.rate}%`; };
      c.onmouseleave = () => {
        const st = computeStats(tasks);
        $("trendBadge").textContent = (st.total && st.done === st.total) ? "🎉 全部完成" : (st.total ? "进行中" : "—");
      };
      dots.appendChild(c);

      if (i === 0 || i === 3 || i === 6) {
        const tx = document.createElementNS("http://www.w3.org/2000/svg", "text");
        tx.setAttribute("x", p.x);
        tx.setAttribute("y", 158);
        tx.setAttribute("text-anchor", "middle");
        tx.setAttribute("fill", document.documentElement.dataset.theme === "light" ? "rgba(0,0,0,.45)" : "rgba(255,255,255,.55)");
        tx.setAttribute("font-size", "11");
        tx.textContent = p.dateStr.slice(5);
        axis.appendChild(tx);
      }
    }

    const grid = [0, 50, 100];
    for (const g of grid) {
      const y = padY + (innerH * (1 - g / 100));
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", padX);
      line.setAttribute("x2", W - padX);
      line.setAttribute("y1", y);
      line.setAttribute("y2", y);
      line.setAttribute("stroke", document.documentElement.dataset.theme === "light" ? "rgba(0,0,0,.08)" : "rgba(255,255,255,.08)");
      line.setAttribute("stroke-width", "1");
      axis.appendChild(line);

      const ty = document.createElementNS("http://www.w3.org/2000/svg", "text");
      ty.setAttribute("x", 6);
      ty.setAttribute("y", y + 4);
      ty.setAttribute("fill", document.documentElement.dataset.theme === "light" ? "rgba(0,0,0,.45)" : "rgba(255,255,255,.55)");
      ty.setAttribute("font-size", "11");
      ty.textContent = g + "%";
      axis.appendChild(ty);
    }
  }

  function renderAll(fromAction = false) {
    if (fromAction) setSavedBadge("已保存");
    renderHeader();
    renderTasks();
    renderTrend();
  }

  function applySort() {
    if (sortMode === "min") {
      tasks.sort((a, b) => (a.minutes - b.minutes) || (a.createdAt > b.createdAt ? 1 : -1));
    } else if (sortMode === "doneToggle") {
      if (doneToBottom) tasks.sort((a, b) => Number(a.done) - Number(b.done));
    }
  }

  function sortByMinutes() {
    sortMode = "min";
    localStorage.setItem(SORT_KEY, sortMode);
    tasks.sort((a, b) => (a.minutes - b.minutes) || (a.createdAt > b.createdAt ? 1 : -1));
    saveForDate();
    renderAll(true);
    toast("已按时长排序");
  }

  function toggleDoneBottom() {
    sortMode = "doneToggle";
    localStorage.setItem(SORT_KEY, sortMode);
    doneToBottom = !doneToBottom;
    applySort();
    saveForDate();
    renderAll(true);
    toast(doneToBottom ? "已完成置底" : "已恢复原顺序");
  }

  function copyUnfinishedToTomorrow() {
    const unfinished = tasks.filter(t => !t.done);
    if (!unfinished.length) { toast("没有未完成任务"); return; }
    const tomorrow = new Date(currentDate);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const dateStr = formatDate(tomorrow);
    const raw = localStorage.getItem(keyOf(dateStr));
    const arr = raw ? safeParse(raw, []) : [];
    const merged = arr.concat(unfinished.map(t => ({
      id: cryptoId(),
      text: t.text,
      minutes: t.minutes,
      done: false,
      createdAt: nowISO()
    })));
    localStorage.setItem(keyOf(dateStr), JSON.stringify(merged));
    toast("已复制到明天");
  }

  function validateInputs(text, minutes) {
    const t = String(text || "").trim();
    const m = parseInt(minutes, 10);
    if (!t) return { ok: false, msg: "任务内容不能为空" };
    if (!Number.isFinite(m) || m <= 0) return { ok: false, msg: "预计分钟必须是正整数" };
    return { ok: true, text: t, minutes: m };
  }

  function addTask() {
    const text = $("taskText").value;
    const minutes = $("taskMin").value;
    const v = validateInputs(text, minutes);
    if (!v.ok) { toast(v.msg); return; }
    tasks.unshift({ id: cryptoId(), text: v.text, minutes: v.minutes, done: false, createdAt: nowISO() });
    $("taskText").value = "";
    $("taskMin").value = "";
    applySort();
    saveForDate();
    renderAll(true);
    toast("已添加");
  }

  let monthView = new Date();

  function daysInMonth(y, mIndex) { return new Date(y, mIndex + 1, 0).getDate(); }
  function dateFromYMD(y, mIndex, day) { const d = new Date(y, mIndex, day); d.setHours(12, 0, 0, 0); return d; }
  function weekdayMon0(d) { return (d.getDay() + 6) % 7; }
  function getDayDoneMinutes(dateStr) {
    const raw = localStorage.getItem(keyOf(dateStr));
    const arr = raw ? safeParse(raw, []) : [];
    const st = computeStats(arr);
    return st.doneMin || 0;
  }

  function buildMonthGrid(viewDate) {
    const y = viewDate.getFullYear();
    const m = viewDate.getMonth();
    const first = dateFromYMD(y, m, 1);
    const dim = daysInMonth(y, m);
    const offset = weekdayMon0(first);

    const vals = [];
    for (let day = 1; day <= dim; day++) {
      const ds = formatDate(dateFromYMD(y, m, day));
      vals.push(getDayDoneMinutes(ds));
    }
    const maxV = Math.max(0, ...vals);

    $("monthTitle").textContent = `${y}-${pad2(m + 1)} 本月完成情况`;
    const grid = $("monthGrid");
    grid.innerHTML = "";

    const totalCells = 42;
    for (let i = 0; i < totalCells; i++) {
      const cell = document.createElement("div");
      cell.className = "hmCell";
      const dayNum = i - offset + 1;

      if (dayNum < 1 || dayNum > dim) {
        cell.classList.add("empty");
        grid.appendChild(cell);
        continue;
      }

      const d = dateFromYMD(y, m, dayNum);
      const dateStr = formatDate(d);
      const doneMin = vals[dayNum - 1];

      const t = maxV ? (doneMin / maxV) : 0;
      const alpha = doneMin === 0 ? 0.06 : (0.12 + 0.78 * t);

      const isLight = document.documentElement.dataset.theme === "light";
      const base = "45,212,191";
      cell.style.background = `rgba(${base}, ${alpha})`;
      cell.style.borderColor = isLight ? "rgba(0,0,0,.10)" : "rgba(255,255,255,.14)";

      cell.title = `${dateStr} · 已完成 ${doneMin} 分钟`;
      cell.dataset.date = dateStr;

      const label = document.createElement("div");
      label.className = "d";
      label.textContent = String(dayNum);
      cell.appendChild(label);

      cell.onclick = () => {
        const target = new Date(dateStr + "T12:00:00");
        currentDate = target;
        loadForDate(currentDate);
        renderAll();
        closeMonthModal();
      };

      grid.appendChild(cell);
    }

    $("monthHint").innerHTML = `方格颜色越深，代表当天<strong>已完成时长</strong>越长（本月最大：<strong>${maxV}</strong> 分钟）`;
  }

  function openMonthModal() {
    monthView = new Date(currentDate);
    monthView.setDate(1);
    $("monthMask").style.display = "flex";
    buildMonthGrid(monthView);
  }

  function closeMonthModal() { $("monthMask").style.display = "none"; }
  function shiftMonth(delta) {
    monthView = new Date(monthView);
    monthView.setMonth(monthView.getMonth() + delta);
    monthView.setDate(1);
    buildMonthGrid(monthView);
  }

  function goDay(delta) {
    currentDate.setDate(currentDate.getDate() + delta);
    loadForDate(currentDate);
    renderAll();
  }

  function goToday() {
    currentDate = new Date();
    loadForDate(currentDate);
    renderAll();
  }

  const fx = $("fx");
  const ctx = fx.getContext("2d");
  let confetti = [];
  let fxTimer = 0;
  let fxRunning = false;

  function resizeFX() {
    fx.width = window.innerWidth * devicePixelRatio;
    fx.height = window.innerHeight * devicePixelRatio;
    fx.style.width = window.innerWidth + "px";
    fx.style.height = window.innerHeight + "px";
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  window.addEventListener("resize", resizeFX);

  function burstConfetti() {
    if (Date.now() - fxTimer < 1500) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    fxTimer = Date.now();

    const w = window.innerWidth, h = window.innerHeight;
    const density = Math.round((w * h) / 20000);
    const count = clamp(density, 60, 140);

    for (let i = 0; i < count / 2; i++) {
      confetti.push({
        x: 30 + Math.random() * 40, y: h - 30 - Math.random() * 20,
        vx: 3.5 + Math.random() * 5.5, vy: -10 - Math.random() * 8,
        g: 0.20 + Math.random() * 0.10, r: 2 + Math.random() * 3, a: 1,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.25, hue: Math.random() * 360
      });
    }

    for (let i = 0; i < count / 2; i++) {
      confetti.push({
        x: w - 30 - Math.random() * 40, y: h - 30 - Math.random() * 20,
        vx: -(3.5 + Math.random() * 5.5), vy: -10 - Math.random() * 8,
        g: 0.20 + Math.random() * 0.10, r: 2 + Math.random() * 3, a: 1,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.25, hue: Math.random() * 360
      });
    }

    if (!fxRunning) { fxRunning = true; requestAnimationFrame(drawFX); }
  }

  function drawFX() {
    if (!confetti.length) { ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); fxRunning = false; return; }
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (const p of confetti) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.a *= 0.992;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = clamp(p.a, 0, 1);
      ctx.fillStyle = `hsl(${p.hue} 90% 60%)`;
      ctx.fillRect(-p.r * 2, -p.r, p.r * 4, p.r * 2);
      ctx.restore();
    }
    confetti = confetti.filter(p => p.a > 0.05 && p.y < window.innerHeight + 60);
    requestAnimationFrame(drawFX);
  }

  function bind() {
    $("addTask").onclick = addTask;
    $("taskText").addEventListener("keydown", (e) => { if (e.key === "Enter") addTask(); });
    $("taskMin").addEventListener("keydown", (e) => { if (e.key === "Enter") addTask(); });

    $("prevDay").onclick = () => goDay(-1);
    $("nextDay").onclick = () => goDay(1);
    $("todayBtn").onclick = goToday;

    $("clearDay").onclick = () => {
      if (!tasks.length) { toast("当天没有任务"); return; }
      if (confirm("确定清空当天所有任务吗？")) {
        tasks = [];
        saveForDate();
        renderAll(true);
        toast("已清空");
      }
    };

    $("themeBtn").onclick = () => {
      const cur = document.documentElement.dataset.theme || "dark";
      applyTheme(cur === "dark" ? "light" : "dark");
      renderTrend();
      toast("主题已切换");
    };

    $("openMonth").onclick = openMonthModal;
    $("closeMonth").onclick = closeMonthModal;
    $("monthMask").addEventListener("click", (e) => { if (e.target === $("monthMask")) closeMonthModal(); });

    $("monthPrev").onclick = () => shiftMonth(-1);
    $("monthNext").onclick = () => shiftMonth(1);
    $("monthNow").onclick = () => { monthView = new Date(currentDate); monthView.setDate(1); buildMonthGrid(monthView); };

    $("copyUnfinished").onclick = copyUnfinishedToTomorrow;
    $("sortByMin").onclick = sortByMinutes;
    $("sortByDone").onclick = toggleDoneBottom;

    document.querySelectorAll(".mobile-nav .nav-item").forEach(item => {
      item.addEventListener("click", () => {
        document.querySelectorAll(".mobile-nav .nav-item").forEach(i => i.classList.remove("active"));
        item.classList.add("active");
        const view = item.dataset.view;
        if (view === "calendar") openMonthModal();
      });
    });
  }

  function init() {
    initTheme();
    resizeFX();
    bind();
    loadForDate(currentDate);
    renderAll();
  }

  init();
})();
</script>
</body>
</html>
